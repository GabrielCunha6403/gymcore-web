<div class="toast-container" aria-live="polite" aria-atomic="true">
  @for (toast of toasts(); track toast.id) {
    <section
      class="toast-message"
      [class.toast-message--success]="toast.type === 'success'"
      [class.toast-message--error]="toast.type === 'error'"
      [class.toast-message--warning]="toast.type === 'warning'"
      [attr.aria-label]="ariaLabel(toast)"
      role="status"
    >
      <i class="toast-icon {{ icon(toast.type) }}" aria-hidden="true"></i>

      <div class="toast-content">
        <strong>{{ toast.title }}</strong>
        @if (toast.description) {
          <span>{{ toast.description }}</span>
        }
      </div>

      <button
        class="toast-close"
        type="button"
        [attr.aria-label]="'Fechar aviso ' + toast.title"
        (click)="dismiss(toast.id)"
      >
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    </section>
  }
</div>
