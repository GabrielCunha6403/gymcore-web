<article [routerLink]="['/estabelecimentos', estabelecimento().id]" class="estabelecimento-item" [class.estabelecimento-item--card]="viewMode() === 'cards'">
  <div class="estabelecimento-item__media">
    @if (estabelecimento().imagemUrl) {
      <img
        class="estabelecimento-item__image"
        [src]="estabelecimento().imagemUrl"
        [alt]="'Foto do estabelecimento ' + estabelecimento().nomeFantasia"
      >
    } @else {
      <span class="estabelecimento-item__placeholder">{{ initials() }}</span>
    }
  </div>

  <div class="estabelecimento-item__content">
    <div class="estabelecimento-item__header">
      <div class="estabelecimento-item__headline">
        <h2 class="estabelecimento-item__title">{{ estabelecimento().nomeFantasia }}</h2>
        <span class="estabelecimento-item__subtitle">{{ estabelecimento().razaoSocial }}</span>
      </div>

      <span
        class="estabelecimento-item__status"
        [class.estabelecimento-item__status--inactive]="statusClass() === 'estabelecimento-item__status--inactive'"
        [class.estabelecimento-item__status--active]="statusClass() === 'estabelecimento-item__status--active'"
        [class.estabelecimento-item__status--blocked]="statusClass() === 'estabelecimento-item__status--blocked'"
      >{{ formattedStatus() }}</span>
    </div>

    <div class="estabelecimento-item__details">
      <span class="estabelecimento-item__detail">
        <i class="pi pi-id-card" aria-hidden="true"></i>
        <span>{{ estabelecimento().cnpj }}</span>
      </span>

      <span class="estabelecimento-item__detail">
        <i class="pi pi-sitemap" aria-hidden="true"></i>
        <span>{{ formattedUnits() }}</span>
      </span>

      <span class="estabelecimento-item__detail">
        <i class="pi pi-envelope" aria-hidden="true"></i>
        <span>{{ estabelecimento().email }}</span>
      </span>

      <span class="estabelecimento-item__detail">
        <i class="pi pi-phone" aria-hidden="true"></i>
        <span>{{ estabelecimento().telefone }}</span>
      </span>
    </div>
  </div>
</article>
