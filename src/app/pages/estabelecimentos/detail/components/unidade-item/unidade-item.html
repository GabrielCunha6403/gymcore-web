<article class="unidade-item" [class.unidade-item--card]="viewMode() === 'cards'">
  <div class="unidade-item__media">
    @if (unidade().imagemUrl) {
      <img
        class="unidade-item__image"
        [src]="unidade().imagemUrl"
        [alt]="'Foto da unidade ' + unidade().nome"
      >
    } @else {
      <span class="unidade-item__placeholder">{{ initials() }}</span>
    }
  </div>

  <div class="unidade-item__content">
    <div class="unidade-item__header">
      <div class="unidade-item__headline">
        <div class="unidade-item__headline-row">
          <h2 class="unidade-item__title">{{ unidade().nome }}</h2>

          @if (unidade().matriz) {
            <span class="unidade-item__tag">Matriz</span>
          }
        </div>

        <span class="unidade-item__subtitle">{{ formattedType() }}</span>
      </div>

      <span
        class="unidade-item__status"
        [class.unidade-item__status--inactive]="statusClass() === 'unidade-item__status--inactive'"
        [class.unidade-item__status--active]="statusClass() === 'unidade-item__status--active'"
        [class.unidade-item__status--blocked]="statusClass() === 'unidade-item__status--blocked'"
      >{{ formattedStatus() }}</span>
    </div>

    <div class="unidade-item__details">
      <span class="unidade-item__detail">
        <i class="pi pi-id-card" aria-hidden="true"></i>
        <span>{{ unidade().cnpj }}</span>
      </span>

      <span class="unidade-item__detail">
        <i class="pi pi-map-marker" aria-hidden="true"></i>
        <span>{{ formattedLocation() }}</span>
      </span>

      <span class="unidade-item__detail">
        <i class="pi pi-building" aria-hidden="true"></i>
        <span>{{ formattedType() }}</span>
      </span>

      <span class="unidade-item__detail">
        <i class="pi pi-envelope" aria-hidden="true"></i>
        <span>{{ unidade().email }}</span>
      </span>

      <span class="unidade-item__detail">
        <i class="pi pi-phone" aria-hidden="true"></i>
        <span>{{ unidade().telefone }}</span>
      </span>
    </div>
  </div>
</article>
